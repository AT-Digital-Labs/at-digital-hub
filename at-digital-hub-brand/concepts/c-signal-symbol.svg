<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Signal: compact A with flat apex + T + precision dot. All straight edges snapped. -->
  <!-- A left leg (parallelogram) — top (72,48) to (96,48); bottom (16,208) to (40,208) -->
  <path d="M16 208 L72 48 L96 48 L40 208 Z" fill="#111111"/>
  <!-- A right leg (parallelogram mirrored) — top (144,48) to (168,48); bottom (120,208) to (144,208) -->
  <path d="M144 48 L168 48 L120 208 L96 208 Z" fill="#111111"/>
  <!-- Flat apex of A -->
  <path d="M72 48 L144 48 L144 72 L72 72 Z" fill="#111111"/>
  <!-- A crossbar (horizontal, snapped) -->
  <path d="M58 148 L126 148 L120 170 L52 170 Z" fill="#111111"/>
  <!-- T crossbar -->
  <path d="M180 48 L240 48 L240 72 L180 72 Z" fill="#111111"/>
  <!-- T stem -->
  <rect x="198" y="72" width="24" height="136" fill="#111111"/>
  <!-- Precision dot — Hub marker, baseline-aligned -->
  <circle cx="178" cy="196" r="12" fill="#111111"/>
</svg>
