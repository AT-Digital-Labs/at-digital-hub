<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Keystone: AT ligature where A's right leg = T's stem (shared stroke) -->
  <rect width="256" height="256" fill="#111111"/>
  <!-- A left leg (slanted parallelogram) -->
  <path d="M28 200 L112 56 L140 56 L56 200 Z" fill="#FFFFFF"/>
  <!-- Shared vertical stem: A's right leg AND T's stem -->
  <rect x="140" y="56" width="24" height="144" fill="#FFFFFF"/>
  <!-- A crossbar (slanted to match left leg's inner edge) -->
  <path d="M97 130 L140 130 L140 150 L85 150 Z" fill="#FFFFFF"/>
  <!-- T crossbar (right arm, grows from top of shared stem) -->
  <rect x="164" y="56" width="64" height="24" fill="#FFFFFF"/>
</svg>
